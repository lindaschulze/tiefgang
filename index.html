<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiefgang – Fragen mit Tiefgang</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4b4b4b;
    padding: 16px;
  }
  .app {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .logo-icon {
    font-size: 2.2rem;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #58CC02;
    margin: 0;
    letter-spacing: -0.5px;
  }
  p.tagline {
    color: #777;
    font-size: 0.95rem;
    margin-top: 2px;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .streak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff4d6;
    border: 2px solid #ffc800;
    border-radius: 20px;
    padding: 6px 14px;
    font-weight: 700;
    color: #b8860b;
    font-size: 0.9rem;
    margin-bottom: 18px;
  }

  .categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .cat-btn {
    background: #fff;
    border: 2px solid #e5e5e5;
    border-bottom: 4px solid #e5e5e5;
    border-radius: 14px;
    padding: 12px 6px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    color: #4b4b4b;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .cat-btn:hover { background: #f7f7f7; }
  .cat-btn.active {
    background: #d7ffb8;
    border-color: #58CC02;
    color: #2b6b00;
  }
  .cat-emoji { display: block; font-size: 1.4rem; margin-bottom: 2px; }

  .question-card {
    background: #fff;
    border: 2px solid #e5e5e5;
    border-radius: 20px;
    padding: 28px 20px;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    font-weight: 700;
    color: #3c3c3c;
    line-height: 1.5;
    margin-bottom: 22px;
    position: relative;
  }

  .btn-primary {
    width: 100%;
    background: #58CC02;
    border: none;
    border-bottom: 5px solid #45a302;
    border-radius: 16px;
    padding: 16px;
    font-family: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    color: #fff;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn-primary:active {
    transform: translateY(3px);
    border-bottom-width: 2px;
  }
  .btn-primary:disabled {
    background: #e5e5e5;
    border-bottom-color: #d0d0d0;
    color: #a0a0a0;
    cursor: not-allowed;
  }

  details {
    margin-top: 20px;
    text-align: left;
  }
  summary {
    cursor: pointer;
    color: #1cb0f6;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .settings {
    margin-top: 10px;
    background: #f7f7f7;
    border-radius: 12px;
    padding: 14px;
    font-size: 0.8rem;
    color: #777;
  }
  .settings input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #e5e5e5;
    margin-top: 8px;
    font-size: 0.85rem;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="logo">
      <span class="logo-icon">🤿</span>
      <h1>Tiefgang</h1>
    </div>
    <p class="tagline">Fragen mit Tiefgang – witzig bis abgrundtief</p>

    <div class="streak">🔥 <span id="streakCount">0</span> Fragen heute</div>

    <div class="categories" id="categories">
      <button class="cat-btn active" data-cat="eisbrecher" data-emoji="🧊">
        <span class="cat-emoji">🧊</span>Eisbrecher
      </button>
      <button class="cat-btn" data-cat="fun" data-emoji="🤪">
        <span class="cat-emoji">🤪</span>Fun & Verrückt
      </button>
      <button class="cat-btn" data-cat="waeredu" data-emoji="🔀">
        <span class="cat-emoji">🔀</span>Würdest du eher
      </button>
      <button class="cat-btn" data-cat="peinlich" data-emoji="😳">
        <span class="cat-emoji">😳</span>Peinlich
      </button>
      <button class="cat-btn" data-cat="beziehung" data-emoji="💬">
        <span class="cat-emoji">💬</span>Beziehung
      </button>
      <button class="cat-btn" data-cat="tiefgruendig" data-emoji="🌊">
        <span class="cat-emoji">🌊</span>Tiefgründig
      </button>
      <button class="cat-btn" data-cat="philosophisch" data-emoji="🧠">
        <span class="cat-emoji">🧠</span>Philosophisch
      </button>
      <button class="cat-btn" data-cat="team" data-emoji="💼">
        <span class="cat-emoji">💼</span>Team & Arbeit
      </button>
    </div>

    <div class="question-card" id="questionBox">
      Wähle eine Kategorie und starte dein Frage-Abenteuer!
    </div>

    <button class="btn-primary" id="askBtn" onclick="getQuestion()">Neue Frage</button>

    <details>
      <summary>⚙️ Einstellungen (API-Key)</summary>
      <div class="settings">
        Dein OpenAI-API-Key wird nur lokal in deinem Browser gespeichert, niemals an Dritte gesendet.
        <input type="password" id="apiKey" placeholder="sk-..." />
      </div>
    </details>
  </div>

<script>
const prompts = {
  eisbrecher: "Erfinde eine leichte, harmlose Eisbrecher-Frage für eine Gruppe, die sich gerade erst kennenlernt. Kurz, freundlich, auf Deutsch.",
  fun: "Erfinde eine absurde, witzige Was-wäre-wenn oder Fun-Frage, die zum Lachen bringt. Kreativ und ausgefallen, auf Deutsch.",
  waeredu: "Erfinde eine 'Würdest du eher'-Frage mit zwei witzigen oder unangenehmen Optionen. Auf Deutsch, im Format 'Würdest du eher X oder Y?'.",
  peinlich: "Erfinde eine spielerische Frage nach einem peinlichen, aber harmlosen Geständnis oder Erlebnis. Auf Deutsch.",
  beziehung: "Erfinde eine ehrliche, warme Frage über Freundschaft oder Beziehungen, die gute Gespräche auslöst. Auf Deutsch.",
  tiefgruendig: "Erfinde eine tiefgründige, nachdenkliche Frage über Leben, Werte, Ängste oder Bedauern. Auf Deutsch, respektvoll formuliert.",
  philosophisch: "Erfinde eine große philosophische Frage ohne eindeutige Antwort, die zum Nachdenken anregt. Auf Deutsch.",
  team: "Erfinde eine lockere, druckarme Icebreaker-Frage, die sich gut für ein Team-Meeting im Job eignet. Auf Deutsch, professionell aber charmant."
};

let currentCategory = 'eisbrecher';
let streak = 0;

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.cat;
  });
});

const askBtn = document.getElementById('askBtn');
const questionBox = document.getElementById('questionBox');
const apiKeyInput = document.getElementById('apiKey');
const streakCount = document.getElementById('streakCount');

apiKeyInput.value = localStorage.getItem('openai_api_key') || '';
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('openai_api_key', apiKeyInput.value);
});

async function getQuestion() {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    questionBox.textContent = "⚠️ Bitte zuerst deinen OpenAI-API-Key unter Einstellungen eintragen.";
    return;
  }

  askBtn.disabled = true;
  askBtn.textContent = "Lädt...";
  questionBox.textContent = "🤿 Tauche in die nächste Frage ein...";

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: "Du bist ein kreativer Fragen-Generator für Gesellschaftsspiele. Antworte NUR mit der Frage, ohne Anführungszeichen, ohne Erklärung." },
          { role: "user", content: prompts[currentCategory] }
        ],
        temperature: 1.1,
        max_tokens: 80
      })
    });

    const data = await response.json();
    if (data.error) {
      questionBox.textContent = "Fehler: " + data.error.message;
    } else {
      const text = data.choices[0].message.content.trim();
      questionBox.textContent = text;
      streak += 1;
      streakCount.textContent = streak;
    }
  } catch (err) {
    questionBox.textContent = "Netzwerkfehler: " + err.message;
  } finally {
    askBtn.disabled = false;
    askBtn.textContent = "Neue Frage";
  }
}
</script>
</body>
</html>
